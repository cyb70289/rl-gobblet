<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gobblet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div id="turn-label" class="turn-label">Red's turn</div>
      <div class="controls">
        <button id="undo-btn" type="button" disabled>Undo</button>
        <button id="restart-btn" type="button">Restart</button>
      </div>
    </header>

    <section id="blue-tray" class="tray tray-blue" aria-label="Blue pieces"></section>

    <main id="board" class="board" aria-label="Game board"></main>

    <section id="red-tray" class="tray tray-red" aria-label="Red pieces"></section>

    <div id="banner" class="banner hidden"></div>
  </div>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
